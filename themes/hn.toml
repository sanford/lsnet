mode = "dark"

# Hacker News's orange, as hn-cli has it (#ff8700), for titles, links,
# points, borders and what's selected; a deeper one for comments' bars; and
# grey for what's secondary. On the terminal's own background: lshn doesn't
# paint this one's. Not an Omarchy theme: lshn's.

