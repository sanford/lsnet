[package]
name = "lsnet"
version = "0.1.0"
edition = "2024"
description = "See what's on your local network: fast, zero-config device discovery and identification"
license = "GPL-3.0-or-later"
repository = "https://github.com/sanford/lsnet"
readme = "README.md"
keywords = ["network", "scanner", "mdns", "arp", "lan"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dns-lookup = "4.0.1"
flate2 = "1.1.10"
libc = "0.2.189"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
pnet = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simple-dns = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
