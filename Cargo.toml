[package]
name = "lsnet"
version = "0.5.0"
edition = "2024"
description = "See what's on your local network: fast, zero-config device discovery and identification"
license = "GPL-3.0-or-later"
repository = "https://github.com/sanford/lsnet"
readme = "README.md"
keywords = ["network", "scanner", "mdns", "arp", "lan"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dns-lookup = "4.0.1"
flate2 = "1.1.10"
ipnetwork = "0.20.0"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
pnet_base = "0.35.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simple-dns = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }

# Raw ARP needs packet capture: BPF on macOS, packet sockets on Linux. Windows
# gets the same from its IP Helper API, so it needs neither these nor Npcap.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
pnet_datalink = "0.35.0"
pnet_packet = "0.35.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
